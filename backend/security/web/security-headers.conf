# Context Guard — Browser App Hardening (static host)
#
# The document policy for the console itself. This lives here rather than in the
# Flask app for a structural reason: a Content-Security-Policy protects the
# document it is *delivered with*. The Flask process serves JSON; it never serves
# index.html, so it cannot set the browser's policy. Putting a CSP on API
# responses (which security/headers.py does) hardens the API; it does nothing for
# the page a user is looking at.
#
# Apply at whatever serves the built console: `frontend/dist` behind nginx, a CDN,
# or an equivalent Caddy/CloudFront config.
#
# WHY THE POLICY BELOW LOOKS LIKE THIS
#
# The Vite development server injects an inline HMR preamble and inline module
# bootstrapping, so a strict `script-src 'self'` breaks hot reload. That is why
# this file is applied to the *built* output, where no inline script exists.
# Development and production therefore differ in scope — an environment
# difference, not a weaker control. There is no switch that turns the CSP off.
#
# `style-src` keeps 'unsafe-inline' deliberately: React sets inline style
# attributes throughout this console (risk colours, bar widths, chart geometry),
# and a nonce-based policy cannot cover a style attribute. Removing it would break
# rendering, so the honest position is to scope it to styles and keep scripts
# strict — where the actual XSS risk lives.

server {
    listen 443 ssl http2;
    server_name console.example.in;

    root /srv/context-guard/frontend/dist;
    index index.html;

    # ── Transport ────────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Document policy ──────────────────────────────────────────────────────
    add_header Content-Security-Policy "\
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; \
connect-src 'self'; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-ancestors 'none'; \
upgrade-insecure-requests" always;

    # ── The rest of the header set ───────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ── API pass-through, same origin ────────────────────────────────────────
    # Keeping the API on the console's own origin means the browser performs no
    # CORS request at all, which is why the allowlist in security/policy.py can
    # stay short. The console's session token is sent as an Authorization header.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only meaningful when the app is told to trust it (TRUST_PROXY_HEADERS).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── A second, coarser flood limit at the edge ────────────────────────────
    # The application enforces its own budgets (security/ratelimit.py, 429 with
    # Retry-After). This is the layer that absorbs a volumetric flood before it
    # reaches Python at all.
    location /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed asset filenames are immutable; the entry point never is.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}

# Declare the shared zone in the http{} block:
#
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
#
# ── Caddy equivalent ────────────────────────────────────────────────────────
#
#   console.example.in {
#       root * /srv/context-guard/frontend/dist
#       encode gzip
