    <!-- Case URLs carry identifiers. Never leak them to a third party through
         the Referer header. The document-level CSP is served by the static host
         (see backend/security/web/security-headers.conf) because a policy has to
         travel with the document it protects. -->
    <meta name="referrer" content="no-referrer" />

  </head>
